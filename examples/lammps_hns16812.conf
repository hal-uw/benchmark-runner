# Worked example: LAMMPS ReaxFF/HNS 16x8x12 on 1x MI300X (the case this skill was built from).
# Results: /work1/sinclair/sairajatg/workloads/lammps/results/{pmc-433875,prof-433930}

WORKLOAD=hns16812
WORKLOAD_DESC="LAMMPS ReaxFF/HNS 16x8x12 (466,944 atoms, 100 steps), KOKKOS HIP double precision, 1x MI300X"

PROFILING_DIR=/work1/sinclair/sairajatg/workloads/lammps/profiling
RESULTS_DIR=/work1/sinclair/sairajatg/workloads/lammps/results

# single MI300X (mi3001x). For 8 GPUs: NGPUS=8, NTASKS=8, SAMPLE_GPUS=0,...,7,
# "-k on g 8" in app_cmd (LAMMPS maps ranks to GPUs itself, so BIND_GPU_PER_TASK=0),
# and submit with: sbatch -p mi3008x -n 8 ...
NGPUS=1
NTASKS=1
BIND_GPU_PER_TASK=0
SAMPLE_GPUS=0

MODULES=(rocm/7.2.0)
ROCM_PATH=/opt/rocm-7.2.0

PROF_LT=/work1/sinclair/sairajatg/minos-sigmetrics26-artifact/rocprofwrap/rocprofwrap_lt
SAMPLE_MS=1

REPO=/work1/sinclair/sairajatg/workloads/lammps/lammps
ARTIFACT=/work1/sinclair/sairajatg/minos-sigmetrics26-artifact
LMP=$REPO/build-mi300x/lmp
REQUIRED_FILES=("$LMP" "$ARTIFACT/datasets/lammps/in.reaxc.hns")

PERF_GREP="Loop time of"

# in.reaxc.hns reads data.hns-equil and ffield.reax.hns by bare file name
stage_inputs() {
    ln -sf "$ARTIFACT/datasets/lammps/in.reaxc.hns"    in.reaxc.hns
    ln -sf "$REPO/examples/reaxff/HNS/data.hns-equil"  data.hns-equil
    ln -sf "$REPO/examples/reaxff/HNS/ffield.reax.hns" ffield.reax.hns
}

app_cmd() {
    APP_CMD=("$LMP" -k on g 1 device 0 -sf kk
             -pk kokkos neigh half neigh/qeq full newton on
             -v x 16 -v y 8 -v z 12
             -in in.reaxc.hns -nocite -log "$OUT_DIR/log.lammps")
}

app_env() {
    :
}
